name: "🐞 Сообщить об ошибке"
description: "Расскажи, что сломалось. Можно голосом и со скринами."
title: "[Баг] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Привет, Лаврик! 👋
        Заполни пару полей — агент сам всё прочитает и починит.

        **Скриншот:** перетащи картинку в поле «Что случилось?» или вставь её туда (Ctrl+V / «Вставить» на телефоне). Ссылка на картинку появится сама.

        **Голос:** нажми микрофон 🎤 на клавиатуре телефона и говори — текст напечатается.
  - type: dropdown
    id: gde
    attributes:
      label: "Где сломалось?"
      options:
        - "Олимпиады"
        - "Каталог методов"
        - "Календарь олимпиад"
        - "Задачи дня"
        - "С чего начать"
        - "Статьи"
        - "AI Тьютор"
        - "Генерация чертежей"
        - "Пробники и тесты"
        - "Куратор"
        - "Статистика"
        - "Банк неточностей"
        - "Профиль"
        - "Друзья"
        - "Чат"
        - "Лидеры"
        - "Встречи (Meet)"
        - "Подписка и оплата"
        - "Вход и регистрация"
        - "Поддержка"
        - "Мои ученики"
        - "Мои гении (дети)"
        - "Прочее"
        - "Приложение на телефон"
        - "О сайте"
        - "Сайт formyla.net (другое)"
        - "Другое"
    validations:
      required: true
  - type: textarea
    id: chto
    attributes:
      label: "Что случилось?"
      description: "Напиши или надиктуй своими словами. Сюда же перетащи скриншоты."
      placeholder: "Нажал на ... и выскочила ошибка ..."
    validations:
      required: true
  - type: textarea
    id: kak
    attributes:
      label: "Как повторить? (если знаешь)"
      placeholder: "1. Открыл ... 2. Нажал ... 3. Получил ..."
  - type: input
    id: ssylka
    attributes:
      label: "Ссылка на страницу (если есть)"
      placeholder: "https://formyla.net/..."
  - type: dropdown
    id: vazhnost
    attributes:
      label: "Насколько мешает?"
      options:
        - "🔴 Вообще не работает"
        - "🟡 Работает, но криво"
        - "🟢 Мелочь"
    validations:
      required: true
