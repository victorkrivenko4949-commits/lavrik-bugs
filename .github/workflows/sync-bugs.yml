name: Баги Лаврика → Issues

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: write

concurrency:
  group: lavrik-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          BUGS_URL: https://lavrik-bugs.onrender.com
          # VISION_V1: авто-описание скриншотов текстом, чтобы агент «видел» картинку.
          # Используется DeepSeek (тот же провайдер и та же vision-модель, что у распознавания фото
          # в генераторе чертежей FORMYLA, geoexact/web.py).
          # Секрет DEEPSEEK_API_KEY добавьте в Settings → Secrets and variables → Actions.
          # Модель/адрес можно переопределить переменными VISION_MODEL / VISION_API_BASE. Без ключа шаг пропускается.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          VISION_API_BASE: ${{ vars.VISION_API_BASE || 'https://api.deepseek.com/v1' }}
          VISION_MODEL: ${{ vars.VISION_MODEL || 'deepseek-v4-flash-vision-exp' }}
        with:
          script: |
            const base = process.env.BUGS_URL;
            const owner = context.repo.owner, repo = context.repo.repo;
            const r = await fetch(base + '/api/bugs', { headers: { 'Accept': 'application/json' } });
            if (!r.ok) throw new Error('bugs api: ' + r.status + ' ' + await r.text());
            const all = await r.json();
            // Строки со status='reply' — ответы Лаврика агенту, а не баги.
            const replies = all.filter(b => b.status === 'reply');
            const bugs = all.filter(b => b.status !== 'reply');
            core.info('bugs in db: ' + bugs.length + ', replies: ' + replies.length);

            // Ветка по умолчанию — туда кладём скриншоты (папка screenshots/).
            const { data: repoInfo } = await github.rest.repos.get({ owner, repo });
            const branch = repoInfo.default_branch;
            const rawBase = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/screenshots`;

            // MULTI_SKRIN_V1 (lavrik-bugs #31): скриншотов может быть несколько.
            // В Supabase колонка skrin: одна картинка — data:... как раньше,
            // несколько — JSON-массив строк data:...
            function parseSkrins(b) {
              const raw = String(b.skrin || '');
              if (!raw) return [];
              if (raw.startsWith('[')) {
                try {
                  const arr = JSON.parse(raw);
                  if (Array.isArray(arr)) return arr.filter(x => /^data:image\/(png|jpeg|jpg|webp|gif);base64,/.test(x));
                } catch (e) { /* не JSON — считаем одиночным */ }
              }
              return /^data:image\/(png|jpeg|jpg|webp|gif);base64,/.test(raw) ? [raw] : [];
            }

            // Сохраняем скриншоты файлами screenshots/bug-N.ext (один) или
            // screenshots/bug-N-i.ext (несколько) и возвращаем прямые ссылки.
            async function saveScreenshot(b, skrin, idx) {
              const m = /^data:image\/(png|jpeg|jpg|webp|gif);base64,([A-Za-z0-9+/=]+)$/.exec(skrin || '');
              if (!m) return null;
              const ext = m[1] === 'jpeg' ? 'jpg' : m[1];
              const suffix = idx > 0 ? `-${idx + 1}` : '';
              const path = `screenshots/bug-${b.id}${suffix}.${ext}`;
              const url = `${rawBase}/bug-${b.id}${suffix}.${ext}`;
              try {
                await github.rest.repos.getContent({ owner, repo, path, ref: branch });
                return url; // уже сохранён
              } catch (e) {
                if (e.status !== 404) throw e;
              }
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path, branch,
                message: `screenshot: bug #${b.id}`,
                content: m[2]
              });
              core.info('saved ' + path);
              return url;
            }

            async function saveAllScreenshots(b) {
              const skrins = parseSkrins(b);
              const urls = [];
              for (let i = 0; i < skrins.length; i++) {
                try { urls.push(await saveScreenshot(b, skrins[i], skrins.length > 1 ? i : -1)); }
                catch (e) { core.warning(`screenshot ${i + 1} for bug #${b.id} failed: ${e.message}`); }
              }
              return urls.filter(Boolean);
            }

            function screenshotLines(b, urls) {
              if (!urls.length) return [];
              const head = urls.length > 1 ? '### Скриншоты (' + urls.length + ')' : '### Скриншот';
              return [
                '', head,
                ...urls.map(u => `![Скриншот бага #${b.id}](${u})`),
                `Также доступны в админке: ${base}/admin.html#bug-${b.id}`
              ];
            }

            // ---------- VISION_V1: текстовое описание скриншота ----------
            // Агент, который чинит баги через GitHub, картинки не видит. Поэтому каждый
            // скриншот один раз прогоняем через vision-модель DeepSeek (OpenAI-совместимый API)
            // и кладём описание в тело issue. Идемпотентно по заголовку VISION_HEAD.
            // Ошибка не ломает синхронизацию.
            const VISION_KEY = process.env.DEEPSEEK_API_KEY || '';
            const VISION_BASE = (process.env.VISION_API_BASE || 'https://api.deepseek.com/v1').replace(/\/+$/, '');
            const VISION_MODEL = process.env.VISION_MODEL || 'deepseek-v4-flash-vision-exp';
            const VISION_MAX_PER_RUN = 8;
            const VISION_HEAD = '### Что на скриншоте (авто-описание ИИ)';
            let visionUsed = 0;
            let visionThinkingUnsupported = false;
            if (!VISION_KEY) core.info('vision: DEEPSEEK_API_KEY не задан — описания скриншотов пропущены');

            function visionPrompt(b) {
              return [
                'Ты помогаешь разработчику сайта FORMYLA.net (подготовка школьников к олимпиадам по математике) разобрать баг-репорт от школьника-тестировщика.',
                'Разработчик НЕ видит картинку — опиши скриншот так, чтобы он понял всё без неё. Отвечай по-русски, строго по пунктам, без вступлений:',
                '1. **Страница/раздел** — что это за экран (заголовки, пункты меню, URL если виден, модальное окно или страница).',
                '2. **Весь видимый текст дословно** — кнопки, подписи полей, сообщения, формулы (сырой LaTeX переписывай как есть), сверху вниз.',
                '3. **Что выделено** — обводки, стрелки, подчёркивания, на какой элемент указывает тестировщик (если нет — так и напиши).',
                '4. **Что выглядит сломанным** — сырой LaTeX, съехавшая вёрстка, пустое поле, неверный чертёж, не тот экран и т.п. Свяжи с текстом бага ниже.',
                '5. **Устройство** — телефон или компьютер, тёмная или светлая тема.',
                '',
                `Текст бага от тестировщика: «${String(b.chto || '').slice(0, 1500)}»`,
                b.kak ? `Как повторить (по его словам): «${String(b.kak).slice(0, 800)}»` : '',
                b.ssylka ? `Ссылка на страницу: ${b.ssylka}` : '',
                b.razdel ? `Раздел по мнению тестировщика: ${b.razdel}` : ''
              ].filter(Boolean).join('\n');
            }

            async function visionCall(payload) {
              return fetch(VISION_BASE + '/chat/completions', {
                method: 'POST',
                headers: {
                  'Authorization': 'Bearer ' + VISION_KEY,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
              });
            }

            async function describeScreenshot(b, skrin) {
              if (!VISION_KEY || !skrin) return null;
              if (visionUsed >= VISION_MAX_PER_RUN) return null;
              if (!/^data:image\/(png|jpeg|jpg|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(skrin)) return null;
              visionUsed++;
              const payload = {
                model: VISION_MODEL,
                max_tokens: 2000,
                temperature: 0.2,
                messages: [{
                  role: 'user',
                  content: [
                    { type: 'text', text: visionPrompt(b) },
                    { type: 'image_url', image_url: { url: skrin } }
                  ]
                }]
              };
              // Как в geoexact/web.py (GEOEXACT_THINKING_FIX): без отключения «думания»
              // vision-модель DeepSeek рассуждает десятки секунд и съедает лимит токенов,
              // возвращая пустой content. При HTTP 400 с упоминанием thinking — повтор без параметра.
              if (!visionThinkingUnsupported) payload.thinking = { type: 'disabled' };
              let rr = await visionCall(payload);
              if (rr.status === 400 && payload.thinking) {
                const t = await rr.text();
                if (/thinking/i.test(t)) {
                  visionThinkingUnsupported = true;
                  delete payload.thinking;
                  rr = await visionCall(payload);
                } else {
                  core.warning(`vision for bug #${b.id}: 400 ${t.slice(0, 300)}`);
                  return null;
                }
              }
              if (!rr.ok) {
                core.warning(`vision for bug #${b.id}: ${rr.status} ${(await rr.text()).slice(0, 300)}`);
                return null;
              }
              const rawText = await rr.text();
              let j;
              try { j = JSON.parse(rawText); }
              catch (e) { core.warning(`vision for bug #${b.id}: не JSON: ${rawText.slice(0, 300)}`); return null; }
              const message = (((j.choices || [])[0] || {}).message || {});
              let msg = message.content;
              let text = '';
              if (typeof msg === 'string') text = msg;
              else if (Array.isArray(msg)) text = msg.map(p => (p && p.text) || '').join('\n');
              text = String(text || '').trim();
              if (!text && typeof message.reasoning_content === 'string') text = message.reasoning_content.trim();
              if (!text) { core.warning(`vision for bug #${b.id}: пустой ответ: ${rawText.slice(0, 300)}`); return null; }
              return text.slice(0, 3500);
            }

            function visionLines(desc, idx, total) {
              const head = total > 1 ? `${VISION_HEAD} №${idx + 1}` : VISION_HEAD;
              return [
                '', head, desc, '',
                `_Описание сгенерировано автоматически (${VISION_MODEL}) — сверяйте со скриншотом._`
              ];
            }

            async function safeDescribe(b, skrin) {
              try { return await describeScreenshot(b, skrin); }
              catch (e) { core.warning(`vision for bug #${b.id} failed: ${e.message}`); return null; }
            }

            async function describeAll(b) {
              const skrins = parseSkrins(b);
              const out = [];
              for (let i = 0; i < skrins.length; i++) {
                const desc = await safeDescribe(b, skrins[i]);
                if (desc) out.push(visionLines(desc, i, skrins.length).join('\n'));
              }
              return out;
            }

            const have = new Map(); // bug id -> issue
            for await (const page of github.paginate.iterator(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100
            })) {
              for (const it of page.data) {
                const m = /lavrik-bug-id:(\d+)/.exec(it.body || '');
                if (m) have.set(Number(m[1]), it);
              }
            }
            core.info('already in issues: ' + have.size);

            const fmt = d => d ? new Date(d).toLocaleString('ru-RU', { timeZone: 'Europe/Moscow' }) : '—';
            const BUG_TYPES = ['Ошибка','Дизайн','Съелся текст','Неправильная задача','Что-то пропало','Тормозит','Другое'];
            let created = 0;
            for (const b of [...bugs].reverse()) {
              if (have.has(Number(b.id))) continue;
              // BUG_TYPE_V1: тип проблемы хранится префиксом в chto: "[Дизайн] текст"
              // Распознаём только допустимые типы, чтобы обычный текст «[...] ...» не стал меткой.
              const tipM = /^\[([^\]]{1,40})\]\s/.exec(String(b.chto || ''));
              const tip = (tipM && BUG_TYPES.includes(tipM[1])) ? tipM[1] : '';
              const text = String(b.chto || '').replace(/\s+/g, ' ').trim();
              const title = `[Баг #${b.id}] ${b.razdel || 'Другое'}: ${text.slice(0, 70)}${text.length > 70 ? '…' : ''}`;
              const lines = [
                `<!-- lavrik-bug-id:${b.id} -->`,
                `**Где сломалось:** ${b.razdel || '—'}`,
                tip ? `**Тип проблемы:** ${tip}` : null,
                `**Важность:** ${b.vazhnost || '—'}`,
                `**Статус в базе:** ${b.status || 'new'}`,
                `**Отправлено:** ${fmt(b.created_at)}`,
                '', '### Что случилось', b.chto || '—'
              ].filter(l => l !== null);
              if (b.kak) lines.push('', '### Как повторить', b.kak);
              if (b.ssylka) lines.push('', `**Ссылка на страницу:** ${b.ssylka}`);
              if (b.skrin) {
                const urls = await saveAllScreenshots(b);
                if (urls.length) lines.push(...screenshotLines(b, urls));
                else lines.push('', `📸 Есть скриншот — открыть: ${base}/admin.html#bug-${b.id}`);
                const descs = await describeAll(b);
                for (const d of descs) lines.push('', d);
              }
              lines.push('', `_Источник: Supabase bugs.id = ${b.id}. Создано GitHub Actions._`);
              const labels = ['bug'];
              const v = String(b.vazhnost || '');
              if (v.startsWith('🔴')) labels.push('критично');
              else if (v.startsWith('🟢')) labels.push('мелочь');
              if (b.razdel) labels.push(String(b.razdel).slice(0, 50));
              if (tip) labels.push(tip);
              await github.rest.issues.create({ owner, repo, title, body: lines.join('\n'), labels });
              created++;
            }
            core.info('created: ' + created);

            // Дозаполнение уже созданных issues со скриншотом:
            //  - нет картинки в теле → добавляем раздел «Скриншот»;
            //  - нет авто-описания → добавляем раздел VISION_HEAD (до VISION_MAX_PER_RUN за запуск).
            let backfilled = 0;
            for (const b of bugs) {
              const it = have.get(Number(b.id));
              if (!it || !b.skrin) continue;
              let body = it.body || '';
              let changed = false;
              if (!body.includes(`screenshots/bug-${b.id}.`) && !body.includes(`screenshots/bug-${b.id}-1.`)) {
                const urls = await saveAllScreenshots(b);
                if (urls.length) { body += '\n' + screenshotLines(b, urls).join('\n'); changed = true; }
              }
              if (!body.includes(VISION_HEAD) && VISION_KEY && visionUsed < VISION_MAX_PER_RUN) {
                const descs = await describeAll(b);
                if (descs.length) { body += '\n' + descs.join('\n\n'); changed = true; }
              }
              if (!changed) continue;
              await github.rest.issues.update({ owner, repo, issue_number: it.number, body });
              backfilled++;
            }
            core.info('backfilled: ' + backfilled + ', vision calls: ' + visionUsed);

            // Ответы Лаврика агенту: публикуем комментарием в issue (kak = 'issue:N').
            // Идемпотентно: метка <!-- lavrik-reply:ID --> защищает от дублей.
            let posted = 0;
            const commentsCache = new Map();
            async function issueComments(n) {
              if (commentsCache.has(n)) return commentsCache.get(n);
              const list = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: n, per_page: 100 });
              commentsCache.set(n, list);
              return list;
            }
            for (const rep of [...replies].reverse()) {
              const m = /^issue:(\d+)$/.exec(String(rep.kak || ''));
              if (!m) continue;
              const n = Number(m[1]);
              const mark = `<!-- lavrik-reply:${rep.id} -->`;
              let comments;
              try { comments = await issueComments(n); }
              catch (e) { core.warning(`reply #${rep.id}: issue ${n} unavailable: ${e.message}`); continue; }
              if (comments.some(c => (c.body || '').includes(mark))) continue;
              await github.rest.issues.createComment({
                owner, repo, issue_number: n,
                body: `${mark}\n**💬 Ответ Лаврика:**\n\n${rep.chto || ''}`
              });
              commentsCache.delete(n);
              posted++;
            }
            core.info('replies posted: ' + posted);
