services:
  - type: web
    name: lavrik-bugs
    runtime: node
    repo: https://github.com/victorkrivenko4949-commits/lavrik-bugs
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: victorkrivenko4949-commits/lavrik-bugs
      - key: ADMIN_KEY
        sync: false
      - key: BUGS_PASSWORD
        sync: false
