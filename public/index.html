<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сообщить об ошибке</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6fb;margin:0;padding:16px;color:#111}
  .card{max-width:560px;margin:0 auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  h1{font-size:24px;margin:0 0 6px}
  p.hint{color:#555;margin:0 0 16px;font-size:15px}
  label{display:block;font-weight:600;margin:14px 0 6px}
  select,textarea,input[type=url]{width:100%;font-size:17px;padding:12px;border:2px solid #d0d5e0;border-radius:12px;box-sizing:border-box}
  textarea{min-height:140px;resize:vertical}
  .btn{display:block;width:100%;font-size:20px;padding:16px;border:0;border-radius:14px;margin-top:12px;cursor:pointer;font-weight:700}
  .mic{background:#e8f0ff;color:#1a4fd6}
  .mic.on{background:#ffe3e3;color:#c0392b;animation:p 1s infinite}
  .send{background:#1a4fd6;color:#fff}
  .send:disabled{background:#9db1e6;cursor:wait}
  @keyframes p{50%{opacity:.6}}
  .small{font-size:13px;color:#777;margin-top:10px}
  .ok{background:#e6f9e8;color:#0d6e1c;border-radius:12px;padding:14px;margin-top:14px;font-size:16px;font-weight:600}
  .err{background:#ffe3e3;color:#c0392b;border-radius:12px;padding:14px;margin-top:14px;font-size:15px}
  .srinput{display:none}
  .srlabel{font-size:13px;color:#1a4fd6;margin-top:8px;cursor:pointer;text-decoration:underline}
  .preview{margin-top:8px;max-width:100%;border-radius:8px;max-height:200px}
  .spinner{display:inline-block;width:16px;height:16px;border:3px solid #fff;border-top-color:transparent;border-radius:50%;vertical-align:-3px;margin-right:8px;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .inbox-banner{max-width:560px;margin:0 auto 14px;background:#fff7e0;border:2px solid #f4a259;border-radius:14px;padding:14px 16px;display:none;align-items:center;gap:12px;cursor:pointer;font-weight:700;font-size:17px}
  .inbox-banner .cnt{background:#c0392b;color:#fff;border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-size:15px;padding:0 8px}
  .inbox{max-width:560px;margin:14px auto 0;display:none}
  .inbox h2{font-size:20px;margin:0 0 10px}
  .q{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:12px;border-left:6px solid #d0d5e0}
  .q.wait{border-left-color:#f4a259}
  .q.new{border-left-color:#c0392b}
  .q .bug{font-size:13px;color:#777;margin-bottom:6px}
  .q .ttl{font-weight:700;margin-bottom:10px}
  .msg{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .msg.agent{background:#eef3ff}
  .msg.lavrik{background:#e6f9e8;margin-left:24px}
  .msg .who{font-size:12px;color:#777;margin-bottom:4px;font-weight:600}
  .msg a{color:#1a4fd6}
  .q textarea{min-height:80px;margin-top:8px}
  .q .btn{font-size:17px;padding:12px;margin-top:8px}
  .q .done{color:#0d6e1c;font-weight:600;margin-top:8px;font-size:15px}
  .q .answered{color:#0d6e1c;font-size:14px;margin-top:6px}
  .inbox .empty{color:#777;text-align:center;padding:14px}
</style>
</head>
<body>
<div class="inbox-banner" id="inboxBanner" onclick="document.getElementById('inbox').scrollIntoView({behavior:'smooth'})">
  <span class="cnt" id="inboxCnt">0</span><span>💬 Агент задал тебе вопросы — ответь, чтобы он починил баг</span>
</div>
<div class="card">
  <h1>🐞 Что сломалось, Лаврик?</h1>
  <p class="hint">Нажми микрофон и расскажи. Или напиши. Можно приложить скриншот. Потом — «Отправить».</p>
  <div class="today" id="todayStat" style="display:none;background:#eef3ff;border-radius:12px;padding:10px 14px;margin:0 0 6px;font-size:15px;font-weight:600;color:#1a4fd6"></div>

  <label>Пароль 🔑</label>
  <input type="password" id="parol" placeholder="Пароль (спроси у Виктора)" autocomplete="off" style="width:100%;font-size:17px;padding:12px;border:2px solid #d0d5e0;border-radius:12px;box-sizing:border-box">

  <label>Где сломалось?</label>
  <select id="gde">
    <optgroup label="Учёба">
      <option>Олимпиады</option>
      <option>Каталог методов</option>
      <option>Календарь олимпиад</option>
      <option>Задачи дня</option>
      <option>С чего начать</option>
      <option>Статьи</option>
      <option>AI Тьютор</option>
      <option>Генерация чертежей</option>
      <option>Пробники и тесты</option>
    </optgroup>
    <optgroup label="Подготовка и прогресс">
      <option>Куратор</option>
      <option>Статистика</option>
      <option>Банк неточностей</option>
    </optgroup>
    <optgroup label="Общение и аккаунт">
      <option>Профиль</option>
      <option>Друзья</option>
      <option>Чат</option>
      <option>Лидеры</option>
      <option>Встречи (Meet)</option>
      <option>Подписка и оплата</option>
      <option>Вход и регистрация</option>
      <option>Поддержка</option>
    </optgroup>
    <optgroup label="Учитель и родитель">
      <option>Мои ученики</option>
      <option>Мои гении (дети)</option>
    </optgroup>
    <optgroup label="Другое">
      <option>Прочее</option>
      <option>Приложение на телефон</option>
      <option>О сайте</option>
      <option>Сайт formyla.net (другое)</option>
      <option>Другое</option>
    </optgroup>
  </select>

  <label>Что за проблема?</label>
  <select id="tip">
    <option>Ошибка</option>
    <option>Дизайн</option>
    <option>Съелся текст</option>
    <option>Неправильная задача</option>
    <option>Что-то пропало</option>
    <option>Тормозит</option>
    <option>Другое</option>
  </select>

  <label>Что случилось?</label>
  <textarea id="chto" placeholder="Нажал на ... и выскочила ошибка ..."></textarea>
  <button class="btn mic" id="mic">🎤 Рассказать голосом</button>
  <div class="small" id="micnote"></div>

  <label>Как повторить? (если знаешь)</label>
  <textarea id="kak" placeholder="1. Открыл ... 2. Нажал ..." style="min-height:80px"></textarea>

  <label>Ссылка на страницу (если есть)</label>
  <input type="url" id="ssylka" placeholder="https://formyla.net/..." style="width:100%;font-size:17px;padding:12px;border:2px solid #d0d5e0;border-radius:12px;box-sizing:border-box">

  <label>Скриншот (если есть)</label>
  <input type="file" id="skrin" accept="image/*" class="srinput">
  <label class="srlabel" for="skrin" id="srlabel">📎 Прикрепить скриншот</label>
  <img id="skrinPreview" class="preview" style="display:none">

  <label>Насколько мешает?</label>
  <select id="vazhnost">
    <option>🔴 Вообще не работает</option>
    <option selected>🟡 Работает, но криво</option>
    <option>🟢 Мелочь</option>
  </select>

  <button class="btn send" id="send">Отправить ➜</button>

  <div class="ok" id="okmsg" style="display:none">✅ <span id="oktext">Обращение №… сохранено</span></div>
  <div class="err" id="errmsg" style="display:none">⚠️ <span id="errtext"></span></div>
</div>

<div class="inbox" id="inbox">
  <h2>💬 Вопросы от агента</h2>
  <label style="margin-top:0">Пароль 🔑</label>
  <input type="password" id="parolInbox" placeholder="Пароль (тот же, что в форме)" autocomplete="off" style="width:100%;font-size:17px;padding:12px;border:2px solid #d0d5e0;border-radius:12px;box-sizing:border-box">
  <div id="inboxList"></div>
</div>

<script>
const chto = document.getElementById('chto');
const mic = document.getElementById('mic');
const note = document.getElementById('micnote');

/* PAROL_PERSIST_V1: пароль запоминается в браузере Лаврика (localStorage),
   поля формы и ответов синхронизируются — вводить один раз. */
const PAROL_KEY = 'lb_parol';
function loadParol(){
  const v = localStorage.getItem(PAROL_KEY) || '';
  document.getElementById('parol').value = v;
  document.getElementById('parolInbox').value = v;
}
['parol','parolInbox'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', () => {
    localStorage.setItem(PAROL_KEY, el.value.trim());
    const other = document.getElementById(id === 'parol' ? 'parolInbox' : 'parol');
    if (other.value !== el.value) other.value = el.value;
  });
});
loadParol();

/* TODAY_COUNT_V1: «сколько добавлено сегодня» — по московскому времени. */
async function loadTodayCount(){
  try {
    const r = await fetch('/api/bugs');
    const a = await r.json();
    const fmt = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Moscow' });
    const today = fmt.format(new Date());
    const n = a.filter(b => b.created_at && fmt.format(new Date(b.created_at)) === today).length;
    const el = document.getElementById('todayStat');
    el.textContent = '📊 Сегодня добавлено багов: ' + n;
    el.style.display = 'block';
  } catch(e) { /* база недоступна — тихо */ }
}
loadTodayCount();
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, base = '';

if (!SR) {
  mic.disabled = true;
  mic.textContent = '🎤 Голос: нажми микрофон на клавиатуре';
  note.textContent = 'В этом браузере нет распознавания речи. Открой в Chrome или используй микрофон на клавиатуре телефона.';
} else {
  rec = new SR();
  rec.lang = 'ru-RU';
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = e => {
    let fin = '', tmp = '';
    for (let i = 0; i < e.results.length; i++) {
      (e.results[i].isFinal ? fin += e.results[i][0].transcript + ' ' : tmp += e.results[i][0].transcript);
    }
    chto.value = (base + fin + tmp).trim();
  };
  rec.onerror = e => { note.textContent = 'Микрофон: ' + e.error + '. Разреши доступ к микрофону и попробуй ещё.'; stop(); };
  rec.onend = () => { if (listening) stop(); };
}
function start(){ base = chto.value ? chto.value.trim() + ' ' : ''; listening = true; mic.classList.add('on'); mic.textContent = '⏹ Говори… нажми, чтобы остановить'; rec.start(); }
function stop(){ listening = false; mic.classList.remove('on'); mic.textContent = '🎤 Рассказать голосом'; try { rec && rec.stop(); } catch(_){} }
mic.onclick = () => listening ? stop() : start();

const skrin = document.getElementById('skrin');
const skrinPreview = document.getElementById('skrinPreview');
const srlabel = document.getElementById('srlabel');
skrin.onchange = () => {
  if (skrin.files && skrin.files[0]) {
    srlabel.textContent = '📎 ' + skrin.files[0].name + ' (нажми, чтобы заменить)';
    const r = new FileReader();
    r.onload = e => { skrinPreview.src = e.target.result; skrinPreview.style.display = 'block'; };
    r.readAsDataURL(skrin.files[0]);
  } else {
    srlabel.textContent = '📎 Прикрепить скриншот';
    skrinPreview.style.display = 'none';
  }
};

function reset(){
  document.getElementById('parol').value = '';
  document.getElementById('gde').selectedIndex = 0;
  document.getElementById('tip').selectedIndex = 0;
  chto.value = '';
  document.getElementById('kak').value = '';
  document.getElementById('ssylka').value = '';
  document.getElementById('vazhnost').selectedIndex = 1;
  skrin.value = ''; skrinPreview.style.display='none'; srlabel.textContent='📎 Прикрепить скриншот';
}

document.getElementById('send').onclick = async () => {
  const btn = document.getElementById('send');
  const okmsg = document.getElementById('okmsg');
  const errmsg = document.getElementById('errmsg');
  const errtext = document.getElementById('errtext');
  okmsg.style.display='none'; errmsg.style.display='none';

  const parol = document.getElementById('parol').value.trim();
  if (!parol) { document.getElementById('parol').focus(); errtext.textContent='Сначала введи пароль сверху.'; errmsg.style.display='block'; return; }
  const text = chto.value.trim();
  if (!text) { chto.focus(); note.textContent = 'Сначала расскажи или напиши, что случилось.'; return; }
  if (listening) stop();

  let skrinB64 = null;
  if (skrin.files && skrin.files[0]) {
    const f = skrin.files[0];
    if (f.size > 5*1024*1024) { errtext.textContent='Скриншот больше 5 МБ — уменьши и попробуй ещё.'; errmsg.style.display='block'; return; }
    skrinB64 = await new Promise(res => { const r=new FileReader(); r.onload=e=>res(e.target.result); r.readAsDataURL(f); });
  }

  btn.disabled = true;
  const prev = btn.textContent;
  btn.innerHTML = '<span class="spinner"></span>Отправляем…';

  try {
    const r = await fetch('/api/bugs', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        parol: parol,
        razdel: document.getElementById('gde').value,
        tip: document.getElementById('tip').value,
        chto: text,
        kak: document.getElementById('kak').value.trim(),
        ssylka: document.getElementById('ssylka').value.trim(),
        vazhnost: document.getElementById('vazhnost').value,
        skrin: skrinB64
      })
    });
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || 'Сервер ответил ошибкой ' + r.status);
    document.getElementById('oktext').textContent = 'Обращение №' + (j.id ?? '?') + ' сохранено. Спасибо, Лаврик!';
    okmsg.style.display='block';
    reset();
  } catch(e) {
    errtext.textContent = (String(e.message||e).includes('Неверный пароль') ? 'Неверный пароль. Спроси пароль у Виктора.' : 'Не отправилось: ' + (e.message||e) + '. Проверь интернет и попробуй ещё.');
    errmsg.style.display='block';
  } finally {
    btn.disabled = false;
    btn.textContent = prev;
  }
};

/* ---------- Входящие вопросы агента ---------- */
const SEEN_KEY = 'lb_seen_comment_ids';
const seen = new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || '[]'));
function saveSeen(){ localStorage.setItem(SEEN_KEY, JSON.stringify([...seen].slice(-500))); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]); }
function fmt(s){
  return esc(s).replace(/(https?:\/\/[^\s)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
               .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}
function when(iso){ try { return new Date(iso).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); } catch(_){ return ''; } }

let notifyAsked = false;
function maybeNotify(newCount){
  if (!('Notification' in window) || newCount <= 0) return;
  if (Notification.permission === 'granted') {
    new Notification('Лаврик, тебе ' + newCount + ' новых вопрос(а) от агента', { body: 'Открой страницу багов и ответь' });
  } else if (Notification.permission === 'default' && !notifyAsked) {
    notifyAsked = true; Notification.requestPermission();
  }
}

async function loadInbox(fresh){
  const banner = document.getElementById('inboxBanner');
  const box = document.getElementById('inbox');
  const list = document.getElementById('inboxList');
  try {
    const r = await fetch('/api/inbox' + (fresh ? '?fresh=1' : ''));
    const j = await r.json();
    if (!j.ok || j.disabled) return;
    const items = j.items || [];
    if (!items.length) { banner.style.display='none'; box.style.display='none'; return; }
    box.style.display = 'block';
    let newCount = 0;
    list.innerHTML = items.map(it => {
      const unseen = it.thread.some(m => m.from==='agent' && !seen.has(m.id));
      if (it.waiting && unseen) newCount++;
      const cls = it.waiting ? (unseen ? 'q new' : 'q wait') : 'q';
      const thread = it.thread.map(m => `<div class="msg ${m.from}"><div class="who">${m.from==='agent'?'🤖 Агент':'🧑 Ты'} · ${when(m.at)}${m.pending?' · ⏳ доставляется':''}</div>${fmt(m.text)}</div>`).join('');
      const form = it.waiting
        ? `<textarea id="ans-${it.issue}" placeholder="Напиши ответ: где именно, что не так, как должно быть…"></textarea>
           <button class="btn send" onclick="sendReply(${it.issue})" id="btn-${it.issue}">Ответить агенту ➜</button>
           <div id="res-${it.issue}"></div>`
        : `<div class="answered">✅ Ты ответил. Агент прочитает и продолжит.</div>
           <textarea id="ans-${it.issue}" placeholder="Хочешь добавить ещё что-то?" style="min-height:56px"></textarea>
           <button class="btn mic" onclick="sendReply(${it.issue})" id="btn-${it.issue}">Дописать</button>
           <div id="res-${it.issue}"></div>`;
      return `<div class="${cls}" id="q-${it.issue}"><div class="bug">Баг #${it.bug_id}${unseen&&it.waiting?' · <b style="color:#c0392b">НОВЫЙ ВОПРОС</b>':''}</div><div class="ttl">${esc(it.title)}</div>${thread}${form}</div>`;
    }).join('');
    const waiting = items.filter(i => i.waiting).length;
    document.getElementById('inboxCnt').textContent = waiting;
    banner.style.display = waiting ? 'flex' : 'none';
    document.title = (waiting ? '(' + waiting + ') ' : '') + 'Сообщить об ошибке';
    maybeNotify(newCount);
    items.forEach(it => it.thread.forEach(m => { if (m.from==='agent') seen.add(m.id); }));
    saveSeen();
  } catch(e) { /* сеть недоступна — тихо */ }
}

async function sendReply(issue){
  const ta = document.getElementById('ans-' + issue);
  const btn = document.getElementById('btn-' + issue);
  const res = document.getElementById('res-' + issue);
  const parol = (document.getElementById('parolInbox').value || '').trim();
  if (!parol) { document.getElementById('parolInbox').focus(); res.innerHTML = '<div class="err">Сначала введи пароль сверху.</div>'; return; }
  const text = (ta.value || '').trim();
  if (!text) { ta.focus(); res.innerHTML = '<div class="err">Сначала напиши ответ.</div>'; return; }
  btn.disabled = true; const prev = btn.textContent; btn.innerHTML = '<span class="spinner"></span>Отправляем…';
  try {
    const r = await fetch('/api/inbox/' + issue + '/reply', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ text, parol }) });
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || 'Сервер ответил ошибкой ' + r.status);
    res.innerHTML = '<div class="done">✅ Ответ принят' + (j.via==='direct' ? ' и уже у агента.' : '. Агент получит его в течение 10 минут.') + ' Спасибо!</div>';
    ta.value = '';
    setTimeout(() => loadInbox(true), 800);
  } catch(e) {
    res.innerHTML = '<div class="err">Не отправилось: ' + esc(e.message||e) + '</div>';
  } finally { btn.disabled = false; btn.textContent = prev; }
}

loadInbox(false);
setInterval(() => loadInbox(false), 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadInbox(false); });
</script>
</body>
</html>
